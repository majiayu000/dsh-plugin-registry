name: Sync plugin registry

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */8 * * *'

permissions:
  contents: write

concurrency:
  group: plugin-registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - run: npm run build
      - name: Commit changed registry snapshot
        run: |
          if git diff --quiet -- public/data/plugins.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/data/plugins.json
          git commit -m "chore: refresh DSH plugin registry"
          git push
