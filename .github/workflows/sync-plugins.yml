name: Sync plugin registry

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

concurrency:
  group: plugin-registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    outputs:
      registry_changed: ${{ steps.registry_changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # rebase 推送需要完整历史（仓库经 delta 压缩后很小）
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - run: npm run validate:registry
      - run: npm run check:ranking
      - run: npm run build
      - name: Commit changed registry snapshot
        id: registry_changes
        run: |
          if git diff --quiet -- public/data/plugins.json public/data/registry-audit.json public/data/version.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/data/plugins.json public/data/registry-audit.json public/data/version.json
          git commit -m "chore: refresh DSH plugin registry"
          # 运行期间 main 可能合入了新提交：先 rebase 再 push，避免非快进推送失败造成误报告警
          git fetch origin main
          pre_rebase=$(git rev-parse HEAD)
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "Could not rebase the snapshot commit onto origin/main" >&2
            exit 1
          fi
          # dist/ 被 gitignore：rebase 一旦重写提交，必须按新树重建并再校验后再 deploy
          if [ "$(git rev-parse HEAD)" != "$pre_rebase" ]; then
            npm test
            npm run validate:registry
            npm run check:ranking
            npm run build
          fi
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy verified build to Cloudflare Pages
        if: steps.registry_changes.outputs.changed == 'true'
        run: npx wrangler pages deploy dist --project-name dsh-plugin-registry --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Close the sync alert issue after a healthy run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "[registry-sync] Scheduled sync failed") | .number' | head -n 1)
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "The latest registry sync completed successfully; closing this alert."
          fi

  alert:
    needs: [sync]
    if: ${{ always() && needs.sync.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the sync alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "[registry-sync] Scheduled sync failed") | .number' | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "The scheduled registry sync failed again: ${RUN_URL}"
          else
            gh issue create --title "[registry-sync] Scheduled sync failed" --body "The scheduled registry sync failed and the public snapshot may be stale. Investigate: ${RUN_URL}"
          fi
