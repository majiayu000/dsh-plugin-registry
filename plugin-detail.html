<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>插件详情 — DeepSeek Harness Plugin Registry</title>
<meta name="description" content="查看 DeepSeek Harness 插件的功能简介、可信来源、GitHub 指标和 DSH 安装命令。" />
<link rel="icon" href="assets/dsh-registry-logo.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/registry.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="index.html"><img class="brand-logo" src="assets/dsh-registry-logo.svg" width="34" height="34" alt="" /><span class="brand-word"><strong>DeepSeek Harness</strong><em>Plugin Registry</em></span></a>
    <nav class="nav"><a href="index.html" class="on">浏览插件</a><a href="publish.html">发布</a><a href="dashboard.html">统计</a></nav>
    <div class="topbar-r"><span class="cli-tag">REGISTRY PREVIEW</span></div>
  </div>
</header>

<main class="wrap" id="detail-root">
  <a class="crumb rise" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 6l-6 6 6 6"/></svg>返回插件列表</a>
  <section class="detail-head rise rise-1">
    <div id="avatar-slot"></div>
    <div style="flex:1;min-width:0">
      <div class="detail-title"><h1 id="plugin-name">正在加载…</h1><span id="source-pill"></span></div>
      <p class="detail-owner" id="plugin-owner"></p>
      <p class="detail-desc" id="plugin-desc"></p>
    </div>
    <div class="detail-cta"><a class="btn" id="repo-button" target="_blank" rel="noopener">查看 GitHub</a><button class="btn btn-primary" id="install-btn">安装步骤</button></div>
  </section>

  <div class="installbox rise rise-2"><span class="dollar">$</span><code id="install-command"></code><button class="copy" id="copy-btn">复制命令</button></div>
  <p class="install-note" id="install-copy-status" role="status"></p>

  <div class="detail-grid">
    <div>
      <div class="tabs"><span class="tab on">插件信息</span></div>
      <div class="tabpane on readme registry-readme">
        <p id="readme-desc"></p>
        <h3>验证范围</h3>
        <div class="evidence-card">
          <span class="evidence-check">✓</span>
          <div><b id="evidence-title"></b><p id="evidence-copy"></p></div>
        </div>
        <h3>GitHub Topics</h3>
        <div class="topic-list" id="topic-list"></div>
      </div>
    </div>
    <aside>
      <div class="side-card"><h4>社区数据</h4><div class="metric-pair"><div><b id="plugin-stars">—</b><span>Stars</span></div><div><b id="plugin-forks">—</b><span>Forks</span></div></div></div>
      <div class="side-card"><h4>信息</h4><div class="kv"><span class="k">维护者</span><span class="v" id="maintainer"></span></div><div class="kv"><span class="k">分类</span><span class="v" id="category"></span></div><div class="kv"><span class="k" id="language-label"></span><span class="v" id="language-status"></span></div><div class="kv"><span class="k" id="updated-label"></span><time class="v" id="updated-status"></time></div><div class="kv"><span class="k">来源</span><span class="v" id="source"></span></div><div class="kv"><span class="k" id="manifest-label"></span><span class="v" id="manifest-status"></span></div><div class="kv"><span class="k" id="installation-test-label"></span><span class="v" id="installation-test-status"></span></div><div class="kv"><span class="k">仓库</span><span class="v"><a id="repo-link" target="_blank" rel="noopener">GitHub</a></span></div></div>
    </aside>
  </div>
</main>

<footer class="footer"><div class="wrap footer-in"><a href="index.html">浏览插件</a><a href="publish.html">发布你的插件</a><span class="fr">预发布版本</span></div></footer>

<script type="module">
await import('/assets/i18n.js');
await import('/assets/plugins.js');
const { findPluginById } = await import('/assets/plugin-detail.js');
(async function () {
  'use strict';
  try { await HR.ready; } catch (error) { document.getElementById('plugin-name').textContent = '插件数据加载失败'; return; }
  var requested = new URLSearchParams(location.search).get('plugin');
  var english = window.HRI18N.locale === 'en-US';
  var plugin = findPluginById(HR.PLUGINS, requested);
  if (!plugin) {
    document.title = english ? 'Plugin not found — DeepSeek Harness Plugin Registry' : '插件不存在 — DeepSeek Harness Plugin Registry';
    document.getElementById('detail-root').innerHTML =
      '<a class="crumb" href="index.html">← ' + (english ? 'Back to plugins' : '返回插件列表') + '</a>' +
      '<div class="prow-empty"><h1>' + (english ? 'Plugin not found' : '没有找到这个插件') + '</h1><p>' +
      (english ? 'The link may be outdated or the plugin is no longer listed.' : '链接可能已经失效，或者该插件已不再收录。') +
      '</p></div>';
    return;
  }
  document.title = plugin.name + ' — DeepSeek Harness Plugin Registry';
  document.getElementById('plugin-name').textContent = plugin.name;
  document.getElementById('plugin-owner').textContent = '@' + plugin.owner;
  var pluginDescription = HR.description(plugin) || (english ? 'No description provided. Review the GitHub source before installing.' : '作者未提供简介；安装前请先查看 GitHub 源码。');
  document.getElementById('plugin-desc').textContent = pluginDescription;
  document.getElementById('readme-desc').textContent = pluginDescription;
  document.getElementById('source-pill').innerHTML = HR.sourcePill(plugin);
  document.getElementById('avatar-slot').appendChild(HR.avatar(plugin, 'lg'));
  document.getElementById('install-command').textContent = plugin.install;
  var installCopyStatus = document.getElementById('install-copy-status');
  installCopyStatus.textContent = english
    ? 'Copying this command does not install the plugin. Run it in a terminal to start installation.'
    : '复制命令不会安装插件；只有在终端执行后，安装才会开始。';
  document.getElementById('plugin-stars').textContent = plugin.stars.toLocaleString();
  document.getElementById('plugin-forks').textContent = plugin.forks.toLocaleString();
  document.getElementById('maintainer').textContent = '@' + plugin.owner;
  document.getElementById('category').textContent = HR.categoryName(plugin.category);
  var missingMetadata = english ? 'Not provided' : '未提供';
  var language = typeof plugin.language === 'string' ? plugin.language.trim() : '';
  document.getElementById('language-label').textContent = english ? 'Language' : '开发语言';
  document.getElementById('language-status').textContent = language || missingMetadata;
  document.getElementById('updated-label').textContent = english ? 'Last updated' : '最近更新';
  var updatedStatus = document.getElementById('updated-status');
  var hasValidPushedAt = typeof plugin.pushedAt === 'string' && !Number.isNaN(Date.parse(plugin.pushedAt));
  updatedStatus.textContent = hasValidPushedAt ? plugin.pushedAt.slice(0, 10) : missingMetadata;
  if (hasValidPushedAt) {
    updatedStatus.dateTime = plugin.pushedAt;
    updatedStatus.title = english ? 'Last push to the GitHub repository' : 'GitHub 仓库最后推送时间';
  }
  document.getElementById('source').textContent = plugin.source === 'curated' ? (english ? 'Community catalog' : '社区目录') : (english ? 'GitHub auto-discovery' : 'GitHub 自动发现');
  var manifestShapeValidated = plugin.verification.manifest === 'shape_validated';
  document.getElementById('manifest-label').textContent = 'Manifest';
  document.getElementById('manifest-status').textContent = manifestShapeValidated ? (english ? 'Shape validated' : '结构已验证') : (english ? 'Not checked' : '未检查');
  document.getElementById('installation-test-label').textContent = english ? 'Installation test' : '安装测试';
  document.getElementById('installation-test-status').textContent = english ? 'Not performed' : '未执行';
  ['repo-button', 'repo-link'].forEach(function (id) { document.getElementById(id).href = plugin.url; });
  document.getElementById('evidence-title').textContent = manifestShapeValidated ? (english ? 'Manifest shape validated' : 'Manifest 结构验证通过') : (english ? 'Imported from the community catalog' : '来自社区目录');
  document.getElementById('evidence-copy').textContent = manifestShapeValidated
    ? (english ? 'At sync time, the root package.json contained a valid dsh.bundle shape. The registry did not run the plugin or test installation. This is not a security audit.' : '同步时，仓库根目录 package.json 包含格式有效的 dsh.bundle；本站没有运行插件，也没有测试实际安装。这不代表安全审计。')
    : (english ? 'Synced from the public awesome-dsh-plugin catalog. The registry did not independently review its quality or security, check its manifest, run the plugin, or test installation.' : '同步自 awesome-dsh-plugin 公开目录；本站未单独审核其功能质量或安全性，也没有检查 Manifest、运行插件或测试实际安装。');
  document.getElementById('topic-list').innerHTML = (plugin.topics || []).map(function (topic) { return '<span class="topic-chip">' + HR.escapeHtml(topic) + '</span>'; }).join('') || '<span class="topic-chip">dsh-plugin</span>';
  document.getElementById('install-btn').addEventListener('click', function () { HR.openInstallDialog(plugin); });
  document.getElementById('copy-btn').addEventListener('click', function () {
    HR.copyText(this, plugin.install).then(function (copied) {
      installCopyStatus.textContent = copied
        ? (english ? 'Command copied. The plugin is not installed yet. Paste and run it in your terminal.' : '命令已复制，插件尚未安装。请粘贴到终端并执行。')
        : (english ? 'Copy failed. Select the command above and copy it manually.' : '复制失败，请选中上方命令手动复制。');
    });
  });
})();
</script>
</body>
</html>
